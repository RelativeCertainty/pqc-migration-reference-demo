apiVersion: upm.pba.io/v1
kind: Pipeline
metadata:
  name: pqc_enterprise_report_projection
  version: 0.2.0
  domain: pqc_migration
  description: Disabled production candidate; isolated C# demo simulates one bounded report projection and controller-owned commit.
  labels:
    pba.io/activation-state: disabled
    pba.io/catalog-authority: repo-candidate
    pba.io/default-enabled: "false"
    pba.io/molecular-worker-contract: "v1"
    pba.io/observability-contract: metadata-only-v1
    pba.io/step-authority: manifest-backed-worker-runs-only
spec:
  domain: pqc_migration
  classification: {data_class: internal, data_sensitivity: none, regulatory_scope: none}
  substrate_profile:
    dominant: [event]
    supporting: [entity]
    governance: [policy, capability]
    evidence: [artifact, observation, relationship]
    event_types: [transform, verify, audit]
    observation_types: [assessment, outcome]
    artifact_types: [evidence, receipt]
    relationship_families: [provenance, authority, execution, boundary]
    policy_families: [private_artifact_policy, authority_policy]
    capability_refs: [pqc.contract_fixture.probe, artifact.read]
    scope_required: true
  primitive_profile:
    dominant: [sequence]
    supporting: [event, state]
    governance: [category, relation]
    evidence: [signal, quantity]
  security:
    mtls: {required: true}
  tenancy: {mode: tenant-aware, allowedTenants: [synthetic-enterprise]}
  parameters:
    maximum_attempts: 1
    controller_commit_required: true
    activation_state: disabled
    external_effects: false
  steps:
    - name: render-synthetic-report
      uses: pqc_enterprise_report_projection@0.2.0
      with:
        baselineId: "{{ context.baselineId }}"
        phase: "{{ context.phase }}"
        synthetic: true
      saveAs: report_projection_result
