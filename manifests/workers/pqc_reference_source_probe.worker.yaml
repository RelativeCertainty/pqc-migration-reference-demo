apiVersion: upm.pba.io/v1
kind: Worker
metadata:
  name: pqc_reference_source_probe
  version: 0.1.0
  domain: pqc_migration
  description: Normalize one fixed synthetic CMDB, certificate or endpoint page; return metadata-only evidence, never persist or contact a provider.
  labels:
    pba.io/activation-state: disabled
    pba.io/catalog-authority: repo-candidate
    pba.io/controller-commit-only: "true"
    pba.io/default-enabled: "false"
    pba.io/molecular-worker-contract: "v1"
    pba.io/observability-contract: metadata-only-v1
    pba.io/output-boundary: metadata-only-worker-result
    pba.io/redaction-contract: metadata-only
spec:
  runtime: python
  image: registry.local/pba/pqc-reference-source-probe:0.1.0
  entrypoint: workers.pqc.reference_source_probe:main
  command: [python, -m, workers.pqc.reference_source_probe]
  substrate_profile:
    dominant: [event]
    supporting: [entity]
    governance: [policy, capability]
    evidence: [artifact, observation, relationship]
    event_types: [transform, verify, audit]
    observation_types: [assessment, readiness, outcome]
    artifact_types: [evidence, receipt]
    relationship_families: [provenance, authority, execution, boundary]
    policy_families: [private_artifact_policy, external_effect_policy, authority_policy]
    capability_refs: [pqc.contract_fixture.probe, artifact.read, governance.read]
    scope_required: true
  primitive_profile:
    dominant: [transformation]
    supporting: [object, event]
    governance: [category, relation]
    evidence: [signal, quantity]
  classification:
    data_class: internal
    data_sensitivity: none
    regulatory_scope: none
  security:
    mtls: {required: true}
  lifecycle:
    max_retries: 0
    backoff_seconds: 0
    timeout_seconds: 30
    retry_on: []
  capabilities: [pqc.contract_fixture.probe, artifact.read, governance.read]
  tenancy:
    mode: tenant-aware
    allowedTenants: [internal]
  placement:
    contract_version: execution-placement.v1
    mode: local_required
    eligible_lanes: [python]
    trust_zones: [on_prem_private]
    resources: {cpu_millis: 500, memory_mb: 256, scratch_mb: 8, gpu_count: 0, max_duration_seconds: 30}
    concurrency: {max_worker_inflight: 1, max_tenant_inflight: 1, max_runner_inflight: 1}
    database: {access_mode: none, max_connections: 0, max_queries_per_run: 0, max_rows_per_query: 0, statement_timeout_ms: 0}
    artifact_io: {input_mode: inline_metadata, output_mode: inline_metadata, max_inline_input_bytes: 2048, max_inline_output_bytes: 2048, require_content_hash: true}
    cost: {max_microusd_per_run: 0}
    fallback: {mode: fail_closed, max_placement_attempts: 1}
    commit: {authority: entity.system.orchestrator, verification_required: true, worker_authoritative_write_allowed: false}
  io:
    inputSchema:
      type: object
      additionalProperties: false
      required: [fixture_kind, tenant_id, observed_at, synthetic]
      properties:
        fixture_kind: {type: string, enum: [cmdb, pki, tls]}
        tenant_id: {type: string, minLength: 2, maxLength: 128, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]+$'}
        observed_at: {type: string, format: date-time}
        synthetic: {const: true}
    outputSchema:
      type: object
      additionalProperties: false
      required: [worker, fixture_kind, record_count, fixture_sha256, observations_sha256, synthetic, external_effects, evidence_status]
      properties:
        worker: {const: pqc_reference_source_probe}
        fixture_kind: {type: string, enum: [cmdb, pki, tls]}
        record_count: {type: integer, minimum: 0, maximum: 100}
        fixture_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        observations_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        synthetic: {const: true}
        external_effects: {const: false}
        evidence_status: {const: contract_tested}
