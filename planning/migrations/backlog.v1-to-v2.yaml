rules:
  allowedDispositions:
    - mapped
    - split
    - merged
    - deferred
    - excluded
    - future_appendix
  invariants:
    - Every v1 epic, feature, and story appears exactly once in mappings.
    - Every non-excluded mapping has at least one targetRef.
    - Every excluded mapping has an empty targetRefs list and an exclusionRationale.
    - Target refs use only admitted v2 epic/story IDs or registered FUT appendix IDs.
    - A split distributes one legacy record across multiple target records.
    - A merged record is absorbed with other legacy records into one target record.
    - Deferred and future-appendix records do not become committed assessment work.
    - No mapping imports employer, customer, credential, environment, or tenant details.

futureAppendices:
  - id: FUT-01
    name: Standardized remediation work-item lifecycle
    admission: Remediation scope, ownership, and asset-type work-item contracts must be approved.
  - id: FUT-02
    name: Immutable remediation planning and approval binding
    admission: Plan, asset-state, approval, window, rollback, and one-use permit contracts must be approved.
  - id: FUT-03
    name: Ticket and change lifecycle automation
    admission: An authorized integration environment and mapped ticket, change, and idempotency policies are required.
  - id: FUT-04
    name: Controlled execution and rollback adapters
    admission: Execution authority, proven provider capabilities, and accepted rollback and failure boundaries are required.
  - id: FUT-05
    name: Independent verification, reharvest, and closure guard
    admission: Verification sources, closure policy, and stale-state rules must be approved.
  - id: FUT-06
    name: Optional migration roadmap and operating-model extension
    admission: Roadmap horizon, capacity assumptions, operating model, and enablement scope must be approved.

