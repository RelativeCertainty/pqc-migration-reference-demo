# SPDX-License-Identifier: CC-BY-4.0
schemaVersion: pqc.project-backlog.v2
classification: public_template
sourceOfTruth: yaml

initiative:
  id: PQC-INIT-01
  name: PQC Current-State Assessment and Risk Analysis
  purpose: Establish a defensible current-state view of the cryptographic estate, evaluate resulting risk and business impact, and produce decision-ready assessment deliverables without authorizing remediation.
  boundaries:
    - This public template contains only employer-neutral planning content and synthetic examples.
    - Assessment and recommendation work does not authorize provider actions, configuration changes, deployment, revocation, or ticket execution.
    - Confidential engagement evidence belongs only in an approved private system of record.
  status: proposed

planningBasis:
  - id: SRC-ASSESSMENT-OUTLINE
    title: Two-phase PQC assessment engagement outline
    authority: engagement_source
    versionOrDate: Approved reference revision
    locatorPolicy: opaque
    evidenceStatus: verified
  - id: SRC-REPORTING-DECISION
    title: Effective two-week project reporting decision
    authority: confirmed_project_decision
    versionOrDate: Confirmed operating decision
    locatorPolicy: opaque
    evidenceStatus: verified
    supersedesSourceRefs: [SRC-ASSESSMENT-OUTLINE]
  - id: SRC-PQC-METHOD
    title: Employer-neutral PQC assessment method
    authority: internal_method
    versionOrDate: Reference method revision 1
    locatorPolicy: opaque
    evidenceStatus: verified
  - id: SRC-LEGACY-BACKLOG
    title: Employer-neutral twelve-week migration backlog
    authority: legacy_template
    versionOrDate: Version 1
    locatorPolicy: opaque
    evidenceStatus: verified

reportingCadences:
  - id: RC-BIWEEKLY
    name: Formal two-week status report
    cadence: every_two_weeks
    intervalWeeks: 2
    phaseRefs: [P1, P2]
    ownerRole: Project manager
    audienceRoles: [Engagement sponsor, Assessment lead, Risk lead]
    requiredSections:
      - Executive summary and overall health
      - Epic progress and forecast
      - Completed, active, blocked, and next-period work
      - Risks, assumptions, issues, dependencies, decisions, and scope changes
      - Metrics and evidence limitations
    dueRule: preceding_business_day_if_closed
    projection: recurring_work_item
    sourceRefs: [SRC-REPORTING-DECISION]
    supersedesSourceRefs: [SRC-ASSESSMENT-OUTLINE]
  - id: RC-PHASE-REVIEW
    name: Phase findings and deliverable review
    cadence: per_phase
    phaseRefs: [P1, P2]
    ownerRole: Assessment lead
    audienceRoles: [Engagement sponsor, Technical reviewers, Business and risk reviewers]
    requiredSections:
      - Scope, method, and evidence limitations
      - Findings or risks requiring factual review
      - Decisions, exceptions, and unresolved questions
      - Deliverable acceptance or formal disposition
    dueRule: phase_review_date
    projection: deliverable
    sourceRefs: [SRC-ASSESSMENT-OUTLINE, SRC-PQC-METHOD]

phases:
  - id: P1
    name: PQC Current-State Assessment
    objective: Produce a validated and evidence-linked view of the authorized cryptographic estate, its dependencies, material exposure conditions, coverage, and known limitations.
    planningLevel: detailed
    targetWindow: {mode: relative, startWeek: 1, endWeek: 8}
    deliverables: [PQC Current-State Assessment Report, Phase 2 input package]
    entryCriteria:
      - Engagement authority, scope process, and information-handling boundaries are confirmed.
      - Required stakeholders and source owners are identified for initiation.
    completionCriteria:
      - Current-state findings are supported by traceable evidence and explicit confidence.
      - Coverage and limitations are reported without asserting unsupported completeness.
      - The report and Phase 2 input package are accepted or formally dispositioned.
    status: proposed
  - id: P2
    name: PQC Risk and Business Impact Analysis
    objective: Evaluate the technical and business significance of the Phase 1 baseline and deliver an evidence-linked, prioritized PQC risk register.
    planningLevel: detailed
    targetWindow: {mode: relative, startWeek: 9, endWeek: 18}
    deliverables: [PQC Risk Register, Decision-ready recommendations and exception record]
    entryCriteria:
      - The Phase 1 baseline and limitations are accepted for risk-analysis use.
      - Risk scales, business-impact criteria, and review authorities are confirmed.
    completionCriteria:
      - Material risks include technical rationale, business impact, evidence confidence, and affected scope.
      - Priorities, recommendations, exceptions, and unresolved decisions are transparent.
      - The risk register is accepted or formally dispositioned.
    status: proposed

gates:
  - id: PQC-G00
    name: Governance and information-handling readiness
    purpose: Confirm the authority, roles, reporting model, and evidence-handling boundary needed to begin controlled assessment work.
    phaseRefs: [P1, P2]
    completionCriteria: [Governance and escalation paths are recorded, Reporting and evidence-handling practices are confirmed]
    requiredEvidence: [Approved governance record, Information-handling decision record]
    decisionOwnerRoles: [Engagement sponsor, Information owner]
    status: proposed
  - id: PQC-P1-G01
    name: Phase 1 scope and source readiness
    purpose: Confirm that scope, method, source ownership, access approach, and evidence-quality rules are ready for authorized discovery.
    phaseRefs: [P1]
    completionCriteria: [Scope and exclusions are reviewable, Source readiness and access limitations are recorded]
    requiredEvidence: [Scope matrix, Source and access register, Assessment method]
    decisionOwnerRoles: [Assessment lead, Engagement sponsor]
    status: proposed
  - id: PQC-P1-G02
    name: Phase 1 baseline validation
    purpose: Confirm that observations have been normalized and correlated with visible provenance, confidence, coverage, conflicts, and unknowns.
    phaseRefs: [P1]
    completionCriteria: [The current-state baseline is traceable, Material limitations and unknowns are explicit]
    requiredEvidence: [Canonical inventory summary, Coverage and reconciliation record, Draft finding register]
    decisionOwnerRoles: [Assessment lead, Technical review lead]
    status: proposed
  - id: PQC-P1-G03
    name: Phase 1 deliverable acceptance
    purpose: Review and disposition the Current-State Assessment Report and its Phase 2 input package.
    phaseRefs: [P1]
    completionCriteria: [Factual review comments are reconciled, The report and handoff package are accepted or dispositioned]
    requiredEvidence: [Final Phase 1 report, Findings review record, Phase 2 input package]
    decisionOwnerRoles: [Engagement sponsor, Assessment lead]
    status: proposed
  - id: PQC-P2-G01
    name: Phase 2 method and input readiness
    purpose: Confirm that the Phase 1 baseline is fit for analysis and that risk, confidence, exception, and prioritization rules are approved.
    phaseRefs: [P2]
    completionCriteria: [Phase 1 inputs are dispositioned, The risk-analysis method is approved]
    requiredEvidence: [Phase 2 readiness record, Approved risk method]
    decisionOwnerRoles: [Risk lead, Engagement sponsor]
    status: proposed
  - id: PQC-P2-G02
    name: Phase 2 analysis validation
    purpose: Confirm that technical exposure, vendor lifecycle, business impact, and prioritization analyses are complete enough for risk-register assembly.
    phaseRefs: [P2]
    completionCriteria: [Material risks have traceable analysis, Priorities and exceptions have documented rationale]
    requiredEvidence: [Risk-analysis working papers, Prioritization and exception record]
    decisionOwnerRoles: [Risk lead, Business review lead]
    status: proposed
  - id: PQC-P2-G03
    name: Phase 2 deliverable acceptance
    purpose: Review and disposition the final PQC Risk Register and engagement recommendations.
    phaseRefs: [P2]
    completionCriteria: [Stakeholder challenge is reconciled, The risk register and handoff are accepted or dispositioned]
    requiredEvidence: [Final risk register, Phase 2 review record, Engagement handoff package]
    decisionOwnerRoles: [Engagement sponsor, Risk lead]
    status: proposed

epics:
  - id: PQC-E00
    phaseRef: CROSS
    name: Engagement Governance, Reporting, and Stakeholder Alignment
    purpose: Maintain decision authority, schedule control, stakeholder alignment, reporting, RAID management, and deliverable acceptance across both assessment phases.
    includedWork:
      - Governance, role, forum, escalation, and decision-authority definition
      - Risks, assumptions, issues, dependencies, decisions, actions, and scope-change control
      - Formal two-week reporting and phase review coordination
    boundaries:
      excludedWork: &governance_excluded [Effectful remediation or client-system changes, Acceptance decisions made without the designated human authority]
      authorityLimits: &authority_limits [Planning and assessment outputs do not authorize external effects or production changes, Named human decision owners retain acceptance and exception authority]
      dataHandlingConstraints: &data_constraints [Confidential evidence must remain in an approved private system of record, Credentials and cryptographic key material must never enter planning artifacts]
      evidenceConstraints: &evidence_constraints [Claims must preserve source provenance and confidence, Missing evidence must remain visible rather than inferred as complete]
    completion:
      description: Governance records, formal reporting cycles, phase reviews, and acceptance activities are complete or formally dispositioned.
      acceptanceCriteria: [Every material decision and blocker has an accountable role and path to disposition, Formal status and phase-review obligations are satisfied]
      requiredEvidence: [Governance record, Biweekly status reports, RAID and decision records, Phase acceptance records]
      decisionOwnerRoles: [Engagement sponsor, Project manager]
    targetWindow: {mode: relative, startWeek: 1, endWeek: 18}
    dependencies: []
    gateRefs: [PQC-G00]
    ownerRole: Project manager
    reviewerRoles: &governance_reviewers [Engagement sponsor, Assessment lead, Risk lead]
    frameworkCrosswalk:
      - frameworkId: FW-GOVERNANCE
        authority: internal_method
        referenceIds: [GovernanceDecision, WorkItem]
        relationship: supports
        note: Governance and reporting provide the decision and evidence boundary around assessment work; the framework does not replace human authority.
    stories:
      - id: PQC-E00-S01
        summary: Establish engagement governance, roles, forums, and escalation
        outcome: Stakeholders can identify decision owners, reviewers, working forums, communication paths, and escalation routes for both phases.
        description: Define the engagement governance model and record role-based accountability without inserting personal or customer identifiers into the public template.
        includedScope: [Governance model, role matrix, meeting forums, escalation path]
        excludedScope: *governance_excluded
        acceptanceCriteria: [Every material decision class and escalation has an accountable role and forum]
        deliverables: &e00s01_artifacts [Governance and role record]
        dependencies: []
        gateRefs: [PQC-G00]
        ownerRole: Project manager
        reviewerRoles: *governance_reviewers
        targetWindow: {mode: relative, startWeek: 1, endWeek: 2}
        sourceRefs: &cross_sources [SRC-ASSESSMENT-OUTLINE, SRC-REPORTING-DECISION, SRC-PQC-METHOD]
        status: ready
        deliveryEvidence:
          status: planned
          requiredArtifacts: *e00s01_artifacts
          basisRefs: *cross_sources
        jiraProjection: &jira_e00
          issueType: Story
          parentPlanningId: PQC-E00
          fixVersion: Cross-phase
          labels: [pqc-assessment, cross-phase]
          component: PQC Assessment
          excluded: false
        legacyGroup: Charter and authority
        legacyRefs: [S1.1.1, S1.1.2, S6.2.1, S7.2.1]
      - id: PQC-E00-S02
        summary: Maintain RAID, decisions, dependencies, actions, and scope changes
        outcome: Project control records remain current, attributable, and usable for timely escalation and decisions.
        description: Maintain the project control registers and make the impact of unresolved items and scope changes visible in each reporting cycle.
        includedScope: [RAID register, decision log, action register, scope-change log]
        excludedScope: *governance_excluded
        acceptanceCriteria: ["Each material item records an owner role, state, due or review point, and disposition"]
        deliverables: &e00s02_artifacts [Current project control registers]
        dependencies: [PQC-E00-S01]
        gateRefs: [PQC-G00]
        ownerRole: Project manager
        reviewerRoles: *governance_reviewers
        targetWindow: {mode: relative, startWeek: 1, endWeek: 18}
        sourceRefs: *cross_sources
        status: ready
        deliveryEvidence:
          status: planned
          requiredArtifacts: *e00s02_artifacts
          basisRefs: *cross_sources
        jiraProjection: *jira_e00
        legacyGroup: Engagement controls
        legacyRefs: [S1.1.1, S1.1.2, S6.2.1]
      - id: PQC-E00-S03
        summary: Deliver biweekly status reporting, findings reviews, and acceptance coordination
        outcome: Decision-makers receive a formal status report every two weeks and each phase deliverable receives an accountable review and disposition.
        description: Operate the effective two-week reporting cadence and coordinate findings-review and deliverable-acceptance events for both phases.
        includedScope: [Nine relative two-week reporting cycles, Phase findings reviews, Acceptance coordination]
        excludedScope: *governance_excluded
        acceptanceCriteria: ["Each reporting period and phase review is delivered, reviewed, and dispositioned through the agreed governance path"]
        deliverables: &e00s03_artifacts [Biweekly status-report series, Phase findings-review records, Acceptance records]
        dependencies: [PQC-E00-S01, PQC-E00-S02]
        gateRefs: [PQC-G00, PQC-P1-G03, PQC-P2-G03]
        ownerRole: Project manager
        reviewerRoles: *governance_reviewers
        targetWindow: {mode: relative, startWeek: 1, endWeek: 18}
        sourceRefs: *cross_sources
        status: ready
        deliveryEvidence:
          status: planned
          requiredArtifacts: *e00s03_artifacts
          basisRefs: *cross_sources
        jiraProjection: *jira_e00
        legacyGroup: Reporting and phase review
        legacyRefs: [S1.1.1, S1.1.2, S6.2.1, S6.3.1]
    status: ready
    legacyRefs: [E1, E6, E7, F1.1, F6.2, F6.3, F7.2]

  - id: PQC-P1-E01
    phaseRef: P1
    name: Confirm Scope, Assessment Method, and Standards
    purpose: Define what will be assessed, how evidence will be evaluated, and what constitutes a defensible Phase 1 result.
    includedWork: [Scope and exclusion definition, Assessment taxonomy and method, Standards and evidence-quality criteria]
    boundaries:
      excludedWork: &phase1_excluded [Remediation design or execution, Final Phase 2 risk scoring, Unsupported claims of complete estate coverage]
      authorityLimits: *authority_limits
      dataHandlingConstraints: *data_constraints
      evidenceConstraints: *evidence_constraints
    completion:
      description: Stakeholders can identify what is in scope, what is excluded, which evidence is required, and how Phase 1 results will be evaluated.
      acceptanceCriteria: [Scope and method are reviewable and versioned, Coverage and confidence rules prevent unsupported completeness claims]
      requiredEvidence: [Scope matrix, Assessment method, Standards register, Evidence-quality criteria]
      decisionOwnerRoles: [Assessment lead, Engagement sponsor]
    targetWindow: {mode: relative, startWeek: 1, endWeek: 2}
    dependencies: [PQC-E00]
    gateRefs: [PQC-P1-G01]
    ownerRole: Assessment lead
    reviewerRoles: &phase1_reviewers [Technical review lead, Information owner, Engagement sponsor]
    frameworkCrosswalk:
      - frameworkId: FW-SCOPE-METHOD
        authority: internal_method
        referenceIds: [KnowledgeSource, CapabilityProbe]
        relationship: prerequisite
        note: Scope and evidence criteria define which sources and capabilities may contribute observations; they do not assert that discovery has occurred.
    stories:
      - id: PQC-P1-E01-S01
        summary: Confirm scope, exclusions, authority, and success criteria
        outcome: The assessment has explicit organizational, technology, data, dependency, and authority boundaries.
        description: Build a versioned scope matrix that distinguishes in-scope, excluded, deferred, and unresolved domains and defines measurable Phase 1 success.
        includedScope: [Scope matrix, exclusions, authority boundaries, success criteria]
        excludedScope: *phase1_excluded
        acceptanceCriteria: [Each assessed domain has a recorded scope disposition and decision owner role]
        deliverables: &p1e01s01_artifacts [Approved scope and exclusion matrix]
        dependencies: [PQC-E00-S01]
        gateRefs: [PQC-P1-G01]
        ownerRole: Assessment lead
        reviewerRoles: *phase1_reviewers
        targetWindow: {mode: relative, startWeek: 1, endWeek: 1}
        sourceRefs: &phase1_sources [SRC-ASSESSMENT-OUTLINE, SRC-PQC-METHOD]
        status: ready
        deliveryEvidence:
          status: planned
          requiredArtifacts: *p1e01s01_artifacts
          basisRefs: *phase1_sources
        jiraProjection: &jira_p1e01
          issueType: Story
          parentPlanningId: PQC-P1-E01
          fixVersion: Phase 1
          labels: [pqc-assessment, phase-1]
          component: PQC Assessment
          excluded: false
        legacyGroup: Charter and authority
        legacyRefs: [S1.1.1, S2.2.2]
      - id: PQC-P1-E01-S02
        summary: Establish the assessment method, taxonomy, and standards register
        outcome: Assessment participants use consistent terms, asset categories, analysis steps, and authoritative guidance.
        description: Define the assessment workflow and taxonomy and establish a provenance-aware register that separates authoritative standards from guidance and claims.
        includedScope: [Assessment workflow, Crypto-asset taxonomy, Standards and guidance register]
        excludedScope: *phase1_excluded
        acceptanceCriteria: ["The method and register distinguish authority, version, applicability, and unresolved interpretation"]
        deliverables: &p1e01s02_artifacts [Assessment method and taxonomy, Standards register]
        dependencies: [PQC-P1-E01-S01]
        gateRefs: [PQC-P1-G01]
        ownerRole: Assessment lead
        reviewerRoles: *phase1_reviewers
        targetWindow: {mode: relative, startWeek: 1, endWeek: 2}
        sourceRefs: *phase1_sources
        status: ready
        deliveryEvidence:
          status: planned
          requiredArtifacts: *p1e01s02_artifacts
          basisRefs: *phase1_sources
        jiraProjection: *jira_p1e01
        legacyGroup: Standards and policy baseline
        legacyRefs: [S1.2.1, S1.2.2, S6.2.2]
      - id: PQC-P1-E01-S03
        summary: Approve evidence-quality, coverage, confidence, and completion rules
        outcome: Reviewers can distinguish observed absence from unassessed scope and can evaluate the strength of each conclusion.
        description: Define evidence sufficiency, provenance, confidence, coverage denominator, conflict, unknown, and phase-completion rules.
        includedScope: [Evidence-quality rubric, Confidence scale, Coverage rules, Completion checks]
        excludedScope: *phase1_excluded
        acceptanceCriteria: ["The rules require visible provenance, denominators, conflicts, unknowns, and limitations"]
        deliverables: &p1e01s03_artifacts [Approved evidence and completion criteria]
        dependencies: [PQC-P1-E01-S02]
        gateRefs: [PQC-P1-G01]
        ownerRole: Technical review lead
        reviewerRoles: *phase1_reviewers
        targetWindow: {mode: relative, startWeek: 2, endWeek: 2}
        sourceRefs: *phase1_sources
        status: ready
        deliveryEvidence:
          status: planned
          requiredArtifacts: *p1e01s03_artifacts
          basisRefs: *phase1_sources
        jiraProjection: *jira_p1e01
        legacyGroup: Canonical inventory contract
        legacyRefs: [S1.2.2, S2.1.1, S2.1.2, S6.1.1, S6.1.2]
    status: ready
    legacyRefs: [E1, E2, E6, F1.1, F1.2, F2.1, F6.1, F6.2]

  - id: PQC-P1-E02
    phaseRef: P1
    name: Establish Source Access and Evidence-Handling Controls
    purpose: Establish safe, approved, read-only access to assessment sources without beginning uncontrolled collection.
    includedWork: [Authoritative source and owner register, Approved access and handling requirements, Source readiness and contingency assessment]
    boundaries:
      excludedWork: *phase1_excluded
      authorityLimits: *authority_limits
      dataHandlingConstraints: *data_constraints
      evidenceConstraints: *evidence_constraints
    completion:
      description: Every planned source has an owner role, approved collection method, access state, handling classification, and contingency for unavailable access.
      acceptanceCriteria: [No collection begins without recorded authority and handling boundaries, Unavailable access remains an explicit limitation]
      requiredEvidence: [Source register, Access decision record, Evidence-handling matrix, Readiness assessment]
      decisionOwnerRoles: [Information owner, Assessment lead]
    targetWindow: {mode: relative, startWeek: 1, endWeek: 3}
    dependencies: [PQC-P1-E01]
    gateRefs: [PQC-P1-G01]
    ownerRole: Discovery lead
    reviewerRoles: *phase1_reviewers
    frameworkCrosswalk:
      - frameworkId: FW-SOURCE-PROFILE
        authority: internal_method
        referenceIds: [KnowledgeSource, CapabilityProbe]
        relationship: direct
        note: Source profiles and capability probes provide a neutral structure for recording authority, access, limitations, and supported collection behavior.
    stories:
      - id: PQC-P1-E02-S01
        summary: Establish the authoritative source and source-owner register
        outcome: Every proposed assessment source has a clear purpose, authority class, owner role, and expected contribution.
        description: Inventory source classes and record their ownership, authority, expected evidence, access path, freshness, and known constraints.
        includedScope: [Source register, Source ownership, Authority and freshness metadata]
        excludedScope: *phase1_excluded
        acceptanceCriteria: ["Each source entry identifies an owner role, authority, expected evidence, and limitation state"]
        deliverables: &p1e02s01_artifacts [Authoritative source and owner register]
        dependencies: [PQC-P1-E01-S01]
        gateRefs: [PQC-P1-G01]
        ownerRole: Discovery lead
        reviewerRoles: *phase1_reviewers
        targetWindow: {mode: relative, startWeek: 1, endWeek: 2}
        sourceRefs: *phase1_sources
        status: ready
        deliveryEvidence:
          status: planned
          requiredArtifacts: *p1e02s01_artifacts
          basisRefs: *phase1_sources
        jiraProjection: &jira_p1e02
          issueType: Story
          parentPlanningId: PQC-P1-E02
          fixVersion: Phase 1
          labels: [pqc-assessment, phase-1]
          component: PQC Assessment
          excluded: false
        legacyGroup: Discovery-source mobilization
        legacyRefs: [S2.1.2, S2.2.1, S2.2.2]
      - id: PQC-P1-E02-S02
        summary: Confirm access, classification, retention, and handling requirements
        outcome: Collection plans respect information ownership, least privilege, classification, retention, and approved storage constraints.
        description: Record read-only access decisions, handling classifications, retention expectations, custody responsibilities, and prohibited data classes.
        includedScope: [Access decisions, Classification and retention matrix, Evidence-custody rules]
        excludedScope: *phase1_excluded
        acceptanceCriteria: [Each source has a documented access and handling disposition before collection]
        deliverables: &p1e02s02_artifacts [Access and evidence-handling matrix]
        dependencies: [PQC-P1-E02-S01]
        gateRefs: [PQC-P1-G01]
        ownerRole: Information owner
        reviewerRoles: *phase1_reviewers
        targetWindow: {mode: relative, startWeek: 2, endWeek: 2}
        sourceRefs: *phase1_sources
        status: ready
        deliveryEvidence:
          status: planned
          requiredArtifacts: *p1e02s02_artifacts
          basisRefs: *phase1_sources
        jiraProjection: *jira_p1e02
        legacyGroup: Discovery-source mobilization
        legacyRefs: [S2.2.2]
      - id: PQC-P1-E02-S03
        summary: Validate source readiness and document unavailable-access contingencies
        outcome: The project knows which sources are ready, constrained, blocked, or unavailable and how each limitation affects coverage.
        description: Perform safe readiness checks and record supported behavior, access failures, fallback evidence, escalation, and coverage consequences.
        includedScope: [Capability and access readiness, Contingency paths, Coverage-impact record]
        excludedScope: *phase1_excluded
        acceptanceCriteria: [Every planned source has a readiness state and a documented contingency or limitation]
        deliverables: &p1e02s03_artifacts [Source readiness and contingency record]
        dependencies: [PQC-P1-E02-S02]
        gateRefs: [PQC-P1-G01]
        ownerRole: Discovery lead
        reviewerRoles: *phase1_reviewers
        targetWindow: {mode: relative, startWeek: 2, endWeek: 3}
        sourceRefs: *phase1_sources
        status: proposed
        deliveryEvidence:
          status: planned
          requiredArtifacts: *p1e02s03_artifacts
          basisRefs: *phase1_sources
        jiraProjection: *jira_p1e02
        legacyGroup: Discovery-source mobilization
        legacyRefs: [S2.2.2]
    status: ready
    legacyRefs: [E2, F2.2]

  - id: PQC-P1-E03
    phaseRef: P1
    name: Validate Existing Inventories and Assessment Artifacts
    purpose: Determine which existing inventory, architecture, security, and vendor artifacts can be trusted and reused before initiating new discovery.
    includedWork: [Existing-artifact register, Authority and quality evaluation, Reuse and conflict disposition]
    boundaries:
      excludedWork: *phase1_excluded
      authorityLimits: *authority_limits
      dataHandlingConstraints: *data_constraints
      evidenceConstraints: *evidence_constraints
    completion:
      description: Existing artifacts are classified as usable, conditionally usable, superseded, conflicting, or insufficient with a recorded rationale.
      acceptanceCriteria: [No existing artifact is treated as authoritative solely because it already exists, Conflicts and stale evidence remain visible]
      requiredEvidence: [Existing-artifact register, Quality assessment, Artifact disposition record]
      decisionOwnerRoles: [Assessment lead, Source owner roles]
    targetWindow: {mode: relative, startWeek: 2, endWeek: 4}
    dependencies: [PQC-P1-E01, PQC-P1-E02]
    gateRefs: [PQC-P1-G01]
    ownerRole: Assessment lead
    reviewerRoles: *phase1_reviewers
    frameworkCrosswalk:
      - frameworkId: FW-EVIDENCE-ADMISSION
        authority: internal_method
        referenceIds: [KnowledgeSource, SourceEvent]
        relationship: supports
        note: Evidence-admission records preserve source authority, freshness, conflicts, and reuse limitations before observations enter the canonical assessment view.
    stories:
      - id: PQC-P1-E03-S01
        summary: Inventory existing assessment sources and artifacts
        outcome: Existing inventory, documentation, and prior analysis inputs are visible in one controlled register.
        description: Record existing artifacts by type, owner role, source reference, coverage claim, freshness, and handling classification.
        includedScope: [Artifact register, Ownership and provenance metadata, Claimed coverage]
        excludedScope: *phase1_excluded
        acceptanceCriteria: ["Each artifact has a stable reference, owner role, provenance, freshness, and claimed scope"]
        deliverables: &p1e03s01_artifacts [Existing-artifact register]
        dependencies: [PQC-P1-E02-S01]
        gateRefs: [PQC-P1-G01]
        ownerRole: Assessment lead
        reviewerRoles: *phase1_reviewers
        targetWindow: {mode: relative, startWeek: 2, endWeek: 3}
        sourceRefs: *phase1_sources
        status: proposed
        deliveryEvidence:
          status: planned
          requiredArtifacts: *p1e03s01_artifacts
          basisRefs: *phase1_sources
        jiraProjection: &jira_p1e03
          issueType: Story
          parentPlanningId: PQC-P1-E03
          fixVersion: Phase 1
          labels: [pqc-assessment, phase-1]
          component: PQC Assessment
          excluded: false
        legacyGroup: Discovery-source mobilization
        legacyRefs: [S2.2.1]
      - id: PQC-P1-E03-S02
        summary: Evaluate authority, completeness, freshness, conflicts, and ownership
        outcome: Reviewers understand the quality and limitations of each existing artifact before reuse.
        description: Apply the approved evidence rules to authority, scope, denominators, recency, ownership, duplication, and conflicting records.
        includedScope: [Artifact-quality evaluation, Conflict and staleness analysis, Coverage-claim review]
        excludedScope: *phase1_excluded
        acceptanceCriteria: [Each quality conclusion is traceable to the approved rubric and source evidence]
        deliverables: &p1e03s02_artifacts [Existing-artifact quality assessment]
