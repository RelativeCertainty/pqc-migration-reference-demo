futureStateAppendix:
  purpose: Preserve a non-committed path from assessment findings to governed remediation while keeping effectful work outside the two-phase assessment backlog.
  boundaries:
    - Appendix items are not engagement commitments, Jira work items, approved architectures, or evidence of implemented capability.
    - Every future external effect requires separate scope, authority, private evidence handling, change control, rollback, and independent verification.
    - Human approval and separation-of-duty requirements remain in force even where automation is technically possible.
  jiraProjection: false
  futureAuthorizationRequired: true
  items:
    - id: FUT-01
      name: Standardized remediation work-item lifecycle
      rationale: Translate prioritized findings into asset-type-specific work items only after remediation scope and ownership are approved.
      futureEntryCriteria: [Remediation taxonomy approved, Accountable owner and ticket authority confirmed]
      legacyRefs: [E5, F5.1, F5.2, F5.3, F6.2, S5.1.2, S5.2.2, S5.3.2, S6.2.1]
    - id: FUT-02
      name: Immutable remediation planning and approval binding
      rationale: Bind future changes to a versioned plan, asset state, approval record, window, rollback path, and one-use execution authority.
      futureEntryCriteria: [Plan and permit contracts approved, Approval and separation-of-duty policy confirmed]
      legacyRefs: [E4, E6, F1.2, F4.1, F6.2, S1.2.2, S4.1.1, S4.2.2, S5.1.2, S5.2.2, S5.3.2, S6.1.2, S6.2.1]
    - id: FUT-03
      name: Ticket and change lifecycle automation
      rationale: Integrate governed work items with ticket, change, task, approval, evidence, and closure workflows through provider-neutral ports.
      futureEntryCriteria: [Authorized integration environment available, Ticket and change policies mapped, Idempotency behavior tested]
      legacyRefs: [E6, F6.2, S6.2.1]
    - id: FUT-04
      name: Controlled execution and rollback adapters
      rationale: Implement exact-plan, approval-bound, ledgered, reversible actions only for asset classes with safe provider behavior and readback.
      futureEntryCriteria: [Execution authority granted, Provider capabilities proven, Rollback and failure boundaries accepted]
      legacyRefs: [E4, E5, E6, F1.2, F4.1, F4.2, F5.1, F5.2, F5.3, F6.1, F6.2, S1.2.2, S4.1.1, S4.1.2, S4.2.1, S4.2.2, S5.1.2, S5.2.1, S5.2.2, S5.3.2, S6.1.1, S6.2.1, S6.3.1]
    - id: FUT-05
      name: Independent verification, reharvest, and closure guard
      rationale: Close future work only when independent readback and fresh inventory evidence match the approved target state.
      futureEntryCriteria: [Verification sources approved, Closure policy and stale-state rules accepted]
      legacyRefs: [E4, E5, E6, F4.1, F5.1, F5.2, F5.3, F6.1, F6.2, S4.1.1, S4.1.2, S5.1.2, S5.2.1, S5.2.2, S5.3.2, S6.1.1, S6.1.2, S6.2.1, S6.3.1]
    - id: FUT-06
      name: Optional migration roadmap and operating-model extension
      rationale: Convert accepted risks and candidates into capacity-aware horizons, ownership, training, and operating practices under separate scope.
      futureEntryCriteria: [Roadmap horizon and capacity assumptions approved, Operating-model and enablement scope authorized]
      legacyRefs: [E3, E7, F3.2, F7.1, F7.2, S3.2.2, S7.1.1, S7.1.2, S7.2.1, S7.2.2]

