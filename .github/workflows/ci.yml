name: Unified CSharp React validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: apps/pqc-enterprise-demo/frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-handoff.txt
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-handoff.txt
          npm --prefix apps/pqc-enterprise-demo/frontend ci
          dotnet restore apps/pqc-enterprise-demo/PqcEnterpriseDemo.csproj --locked-mode --disable-parallel
      - name: Audit frontend dependencies
        run: npm --prefix apps/pqc-enterprise-demo/frontend audit
      - name: Validate committed single application
        run: python scripts/validate_reference.py
